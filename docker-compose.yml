# Monitoring stack. The API runs on the host (make serve); the stack runs here (make monitoring).
#   Prometheus http://localhost:9090   Alertmanager http://localhost:9093   Grafana http://localhost:3000
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./monitoring/prometheus:/etc/prometheus:ro"]
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes: ["./monitoring/alertmanager:/etc/alertmanager:ro"]
    ports: ["9093:9093"]
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # local demo only: no login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
